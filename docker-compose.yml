# Ambiente local. Em produção (Easypanel) o Postgres é um serviço do próprio painel.
#
#   docker compose up -d db          # só o banco (desenvolvimento com `npm run dev`)
#   docker compose --profile app up  # banco + app em container (teste da imagem de produção)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nobre
    ports:
      - "5432:5432"
    volumes:
      - nobre-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nobre"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nobre
      APP_URL: http://localhost:3000
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@churrasconobre.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Troque-Esta-Senha-1}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-fornecedor@churrasconobre.local}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-Troque-Esta-Senha-Longa-1}
    ports:
      - "3000:3000"

volumes:
  nobre-db:
